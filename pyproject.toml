[project]
name = "mio_decomp"
authors = [
    {name = "ShackledMars261"}
]
license = {text = "MIT"}
version = "0.3.1"
description = "A CLI for decompiling the .gin files from MIO: Memories in Orbit."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lz4>=4.4.5",
    "pathvalidate>=3.3.1",
    "pydantic>=2.12.5",
    "rich>=14.3.1",
    "typer>=0.21.1",
    "zstandard>=0.25.0",
]
keywords = ["decompile", "decompiler", "mio", "memories-in-orbit"]

[project.urls]
Homepage = "https://github.com/MIO-Modding/mio-decomp-cli"
"Bug Tracker" = "https://github.com/MIO-Modding/mio-decomp-cli/issues"

[project.scripts]
mio-decomp = "mio_decomp.main:app"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "."
module-name = "mio_decomp._mio_decomp"
features = ["pyo3/extension-module"]

[tool.uv.build-backend]
module-name = "mio_decomp"
module-root = ""

[dependency-groups]
dev = [
    "maturin>=1.12.6",
]
